<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kampstatistikk</title>
  <link rel="stylesheet" href="statistikk.css" />
</head>
<body>

  <h1>Kampstatistikk - 2026</h1>

  <div class="stats-controls">
    <button id="totalBtn" type="button">📊 Totalt</button>

    <select id="matchSelect" aria-label="Velg kamp">
      <option value="">Velg kamp</option>
    </select>

    <button id="printBtn" type="button">🖨️ Skriv ut / PDF</button>
  </div>

  <p id="statsStatus" class="stats-status">Laster statistikk…</p>
  <h2 id="printMatchTitle" class="print-only"></h2>

  <section>
    <h2 id="statsTitle">Spillerstatistikk</h2>
    <table id="playersTable">
      <thead>
        <tr>
          <th>Navn</th>
          <th>👕 Kamper</th>
          <th>⏱️ Minutter</th>
          <th>⚽ Mål</th>
          <th>🟨 Gule</th>
          <th>🟥 Røde</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <p class="back-link"><a href="kamp.html">← Tilbake til kamp</a></p>

  <script type="module" src="statistikk.js"></script>
</body>
</html>
